name: Build and publish release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build self-contained Windows application
        env:
          TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "Tag must use vMAJOR.MINOR.PATCH format." }
          $version = $env:TAG.Substring(1)
          dotnet publish .\ProcessGuardian.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=$version -o "$env:RUNNER_TEMP\ProcessGuardian"
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed." }
          $publishDir = "$env:RUNNER_TEMP\ProcessGuardian"
          $files = @(Get-ChildItem -LiteralPath $publishDir -File | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) { throw "dotnet publish produced no files." }
          $zip = "$env:RUNNER_TEMP\ProcessGuardian-$env:TAG-win-x64.zip"
          Compress-Archive -Path $files -DestinationPath $zip -Force
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ProcessGuardian-$env:TAG-win-x64.zip"
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw "Release archive was not created." }
          gh release create "$env:TAG" "$zip" --verify-tag --title "$env:TAG" --generate-notes
